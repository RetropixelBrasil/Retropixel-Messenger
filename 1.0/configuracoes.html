<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/png" href="assets/RPM_logo.png">
  <meta charset="UTF-8">
  <title>Configurações</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="rp-bg">

  <div class="rp-window">
    <div class="rp-title">Configurações</div>

    <div class="rp-content">

      <label>Status:</label>
      <select id="statusSelect">
        <option value="online">🟢 Online</option>
        <option value="away">🔴 Ausente</option>
        <option value="busy">⛔ Ocupado</option>
      </select>

      <button onclick="saveStatus()">Salvar</button>
      <button onclick="location.href='app.html'">Voltar</button>

    </div>
  </div>

  <script type="module" src="app.js"></script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/png" href="assets/RPM_logo.png">
  <meta charset="UTF-8">
  <title>Retropixel Messenger™</title>
  <link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#4a90d9">

<link rel="apple-touch-icon" href="assets/icon-192.png">
</head>

<body class="rp-bg">

  <div class="messenger-window">

    <div class="top-bar">
      Retropixel Messenger™

      <div>
        <button id="sobreBtn">Sobre</button>
        <button id="configBtn">Configurações</button>
        <button id="termosBtn">Termos</button>
        <button id="logoutBtn">Sair</button>
      </div>
    </div>

    <div class="messenger-body">

      <div class="contacts-panel">
        <div class="user-info">🟢 Online</div>

        <button class="add-contact-btn" id="addContactBtn">
          ➕ Adicionar contato
        </button>

        <div id="contacts" class="contacts-list"></div>
      </div>

      <div class="chat-panel">

        <div id="chatTitle" class="chat-header">
          Selecione um contato
        </div>

        <div id="messages" class="messages"></div>

        <div class="chat-input">
          <input id="messageInput" placeholder="Digite uma mensagem...">
          <button id="sendBtn">Enviar</button>
          <button id="nudgeBtn">⚡</button>
        </div>

      </div>

    </div>

  </div>

  <!-- 🔊 ÁUDIOS -->
  <audio id="clickSound" src="assets/click.wav" preload="auto"></audio>
  <audio id="nudgeSound" src="assets/nudge.wav" preload="auto"></audio>
  <audio id="nudgeSound" src="assets/aeroclick.wav" preload="auto"></audio>

  <script type="module" src="app.js"></script>

</body>
</html>
